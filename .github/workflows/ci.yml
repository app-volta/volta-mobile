name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    uses: app-volta/volta-devops/.github/workflows/reusable-validate-pr.yaml@v1

  build-test:
    name: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do gradlew
        run: chmod +x ./gradlew

      - name: Compilar o APK de debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint do Android
        run: ./gradlew lintDebug --no-daemon

      - name: Publicar o APK de debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volta-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publicar relatórios de teste e lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-mobile
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 5
          if-no-files-found: warn
